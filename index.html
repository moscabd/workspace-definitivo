<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspace Definitivo — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg0:#08090b;--bg1:#0d0e11;--bg2:#111318;--bg3:#171920;--border:#1e2028;--border2:#252830;--text1:#e8e9ee;--text2:#8a8d9a;--text3:#454857;--accent:#6c63ff;--accent2:#3fcf8e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg0);color:var(--text1);font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center}
.wrap{width:100%;max-width:420px;padding:20px;animation:fadeIn .4s ease}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:44px}
.dots{display:flex;gap:5px}
.dot{width:8px;height:8px;border-radius:50%}
.brand-name{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:44px 36px;text-align:center}
.title{font-family:'Syne',sans-serif;font-size:25px;font-weight:700;margin-bottom:10px}
.subtitle{font-size:16px;color:var(--text3);line-height:1.7;margin-bottom:36px}
.google-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px 20px;background:#fff;border:none;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:17px;font-weight:500;color:#1f1f1f;cursor:pointer;transition:all .15s}
.google-btn:hover{box-shadow:0 4px 20px rgba(108,99,255,.25);transform:translateY(-1px)}
.google-btn:active{transform:translateY(0)}
.google-btn svg{width:18px;height:18px;flex-shrink:0}
.divider{margin:22px 0;display:flex;align-items:center;gap:10px;color:var(--text3);font-size:14px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.status{margin-top:16px;font-size:15px;color:var(--text3);min-height:18px}
.error{color:#ff5f5f}
.spinner{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:16px auto;display:none}
.note{margin-top:28px;font-size:14px;color:var(--text3);line-height:1.8;text-align:center}
.note span{color:var(--accent2)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="dots">
      <div class="dot" style="background:var(--accent)"></div>
      <div class="dot" style="background:var(--accent2);opacity:.7"></div>
    </div>
    <div class="brand-name">Workspace Definitivo</div>
  </div>

  <div class="card">
    <div class="title">Bem-vindo de volta</div>
    <div class="subtitle">Seu espaço pessoal de organização.<br>Faça login para continuar.</div>

    <button class="google-btn" onclick="loginWithGoogle()" id="loginBtn">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Entrar com Google
    </button>

    <div class="spinner" id="spinner"></div>
    <div class="status" id="status"></div>
  </div>

  <div class="note">
    🔒 Dados privados e acessíveis <span>somente por você</span>.<br>
    Autenticação segura via Google OAuth + Supabase.
  </div>
</div>

<script>
// ─── CONFIGURAÇÃO ───────────────────────────────────────
// Preencha com seus dados do Supabase após configurar
const SUPABASE_URL = 'https://dpuqurchrhmibkzmskdr.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRwdXF1cmNocmhtaWJrem1za2RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NTM4NTcsImV4cCI6MjA5MTIyOTg1N30.we9ui-K1_cXXD5UYYjtrc-Hrr1U2qKQwaO1qgUF-WX4'
// ────────────────────────────────────────────────────────

const { createClient } = supabase
const db = createClient(SUPABASE_URL, SUPABASE_KEY)

async function checkSession() {
  try {
    const { data: { session } } = await db.auth.getSession()
    if (session) window.location.href = '/app.html'
  } catch(e) {
    console.log('Supabase not configured yet')
  }
}

async function loginWithGoogle() {
  const btn = document.getElementById('loginBtn')
  const spin = document.getElementById('spinner')
  const status = document.getElementById('status')

  btn.disabled = true
  spin.style.display = 'block'
  status.textContent = 'Redirecionando para o Google...'
  status.className = 'status'

  const { error } = await db.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/app.html' }
  })

  if (error) {
    spin.style.display = 'none'
    btn.disabled = false
    status.className = 'status error'
    status.textContent = '✕ ' + error.message
  }
}

checkSession()
</script>
</body>
</html>
